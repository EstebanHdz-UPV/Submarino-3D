<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c2b">
  <title>Catálogo de proyectos STEAM</title>
  <link rel="icon" href="assets/icons/submarino.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--fuente); }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
    .eyebrow { color: var(--acento-2); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 6px 0 4px; font-size: 30px; }
    .tenue { color: var(--tenue); }
    .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 28px; }
    .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .tarjeta.activa { border-color: var(--acento-2); box-shadow: 0 0 0 1px var(--acento-2), var(--sombra); }
    .tarjeta img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel-2); display: block; }
    .cuerpo { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .cuerpo h2 { margin: 0; font-size: 19px; }
    .cuerpo p { margin: 0; line-height: 1.5; }
    .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ok); }
    .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .tarjeta:not(.activa) .estado { color: var(--tenue); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips span { border: 1px solid var(--borde); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; color: var(--acento-2); }
    .fases { margin: 0; padding-left: 18px; font-size: 14px; color: var(--tenue); line-height: 1.6; }
    .btn { margin-top: auto; align-self: flex-start; background: var(--acento); color: #fff; text-decoration: none; padding: 10px 16px; border-radius: var(--radio); font-weight: 700; }
    .btn:focus-visible { outline: 2px solid var(--acento-2); outline-offset: 2px; }
    .aviso { margin-top: 24px; padding: 14px 16px; border: 1px solid var(--aviso); border-radius: var(--radio); color: var(--aviso); }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Core · Catálogo</span>
    <h1>Proyectos STEAM</h1>
    <p class="tenue">Proyectos registrados en la tabla <code>proyectos</code> (ver <code>server/migraciones.js</code>). Solo se muestran los activos.</p>
    <section id="catalogo" class="catalogo" aria-live="polite"><p class="tenue">Cargando catálogo…</p></section>
  </main>
  <script type="module" src="src/proyectos.js"></script>
</body>
</html>
